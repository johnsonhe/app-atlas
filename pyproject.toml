[project]
name = "appstore-research"
version = "0.1.0"
description = "Evidence-led research across iOS app descriptions, metadata, and customer reviews"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "google-genai>=1.47,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
