steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app-atlas:$COMMIT_SHA', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app-atlas:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app-atlas:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--timeout=300'
      - '--max-instances=1'
      - '--memory=1Gi'
      - '--concurrency=4'
      - '--update-labels=commit-sha=$COMMIT_SHA'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,MODEL=gemini-3.5-flash,RESEARCHER_MODEL=gemini-3.5-flash-lite'
      - '--allow-unauthenticated'
substitutions:
  _REGION: northamerica-northeast2
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE: app-atlas-jh5102
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app-atlas:$COMMIT_SHA']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
